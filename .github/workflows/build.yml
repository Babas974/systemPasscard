name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # =========================================================================
  # DETECTER LES CHANGEMENTS
  # =========================================================================
  changes:
    name: Detecter les changements
    runs-on: ubuntu-22.04
    outputs:
      android: ${{ steps.filter.outputs.android }}
      desktop: ${{ steps.filter.outputs.desktop }}
      rust: ${{ steps.filter.outputs.rust }}
      react: ${{ steps.filter.outputs.react }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'appCollege/**'
            desktop:
              - 'dashboard-app/**'
            rust:
              - 'dashboard-app/app/src-tauri/**'
            react:
              - 'dashboard-app/app/src/**'
              - 'dashboard-app/app/package.json'

  # =========================================================================
  # TESTS (seulement si concerne)
  # =========================================================================
  rust-tests:
    name: Tests Rust
    runs-on: ubuntu-22.04
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependances systeme GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libatk1.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-app/app/src-tauri

      - name: Tests unitaires (lib, sans Tauri)
        working-directory: dashboard-app/app/src-tauri
        run: cargo test --no-default-features --lib --verbose

  react-tests:
    name: Tests React (Vitest)
    runs-on: ubuntu-22.04
    needs: [changes]
    if: needs.changes.outputs.react == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Installer pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Installer Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: dashboard-app/app/pnpm-lock.yaml

      - name: Installer dependances
        working-directory: dashboard-app/app
        run: pnpm install --frozen-lockfile

      - name: Lancer les tests
        working-directory: dashboard-app/app
        run: pnpm test

  # =========================================================================
  # BUILDS (conditionnes par les changements + les tests)
  # =========================================================================
  android:
    name: Build Android
    runs-on: ubuntu-22.04
    needs: [changes, rust-tests, react-tests]
    if: |
      always() &&
      needs.changes.outputs.android == 'true' &&
      (needs.rust-tests.result == 'success' || needs.rust-tests.result == 'skipped') &&
      (needs.react-tests.result == 'success' || needs.react-tests.result == 'skipped')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Installer JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Installer Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: appCollege/pnpm-lock.yaml

      - name: Installer dependances appCollege
        working-directory: appCollege
        run: pnpm install --frozen-lockfile

      - name: Build APK release
        working-directory: appCollege/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: appCollege/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14

  tauri-linux:
    name: Build Tauri (Linux)
    runs-on: ubuntu-22.04
    needs: [changes, rust-tests, react-tests]
    if: |
      always() &&
      needs.changes.outputs.desktop == 'true' &&
      (needs.rust-tests.result == 'success' || needs.rust-tests.result == 'skipped') &&
      (needs.react-tests.result == 'success' || needs.react-tests.result == 'skipped')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Installer pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Installer Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: dashboard-app/app/pnpm-lock.yaml

      - name: Dependances systeme Tauri (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-app/app/src-tauri

      - name: Installer dependances frontend
        working-directory: dashboard-app/app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: dashboard-app/app
        run: pnpm tauri build --verbose

      - name: Upload artefacts Tauri (Linux)
        uses: actions/upload-artifact@v6
        with:
          name: tauri-linux
          path: |
            dashboard-app/app/src-tauri/target/release/app
            dashboard-app/app/src-tauri/target/release/bundle/rpm/*.rpm
            dashboard-app/app/src-tauri/target/release/bundle/deb/*.deb
            dashboard-app/app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  tauri-windows:
    name: Build Tauri (Windows)
    runs-on: windows-2025-vs2026
    needs: [changes, rust-tests, react-tests]
    if: |
      always() &&
      needs.changes.outputs.desktop == 'true' &&
      (needs.rust-tests.result == 'success' || needs.rust-tests.result == 'skipped') &&
      (needs.react-tests.result == 'success' || needs.react-tests.result == 'skipped')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Installer pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Installer Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: dashboard-app/app/pnpm-lock.yaml

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-app/app/src-tauri

      - name: Installer dependances frontend
        working-directory: dashboard-app/app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: dashboard-app/app
        run: pnpm tauri build --verbose
        env:
          CI: true

      - name: Upload artefacts Tauri (Windows)
        uses: actions/upload-artifact@v6
        with:
          name: tauri-windows
          path: |
            dashboard-app/app/src-tauri/target/release/app.exe
            dashboard-app/app/src-tauri/target/release/bundle/msi/*.msi
            dashboard-app/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
