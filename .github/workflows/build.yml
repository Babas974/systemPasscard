name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -------------------------------------------------------------------------
  # 1. Tests Rust (bibliotheque partagee)
  # -------------------------------------------------------------------------
  rust-tests:
    name: Tests Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-app/app/src-tauri

      - name: Tests unitaires (lib, sans Tauri)
        working-directory: dashboard-app/app/src-tauri
        run: cargo test --no-default-features --lib --verbose

  # -------------------------------------------------------------------------
  # 2. Build Android (APK)
  # -------------------------------------------------------------------------
  android:
    name: Build Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: appCollege/pnpm-lock.yaml

      - name: Installer pnpm
        run: npm install -g pnpm@9

      - name: Installer dependances appCollege
        working-directory: appCollege
        run: pnpm install --frozen-lockfile

      - name: Build APK debug
        working-directory: appCollege/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: appCollege/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  # -------------------------------------------------------------------------
  # 3. Build Tauri Linux
  # -------------------------------------------------------------------------
  tauri-linux:
    name: Build Tauri (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: dashboard-app/app/pnpm-lock.yaml

      - name: Installer pnpm
        run: npm install -g pnpm@9

      - name: Dependances systeme Tauri (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-app/app/src-tauri

      - name: Installer dependances frontend
        working-directory: dashboard-app/app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: dashboard-app/app
        run: pnpm tauri build --verbose

      - name: Upload artefacts Tauri (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            dashboard-app/app/src-tauri/target/release/app
            dashboard-app/app/src-tauri/target/release/bundle/rpm/*.rpm
            dashboard-app/app/src-tauri/target/release/bundle/deb/*.deb
            dashboard-app/app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  # -------------------------------------------------------------------------
  # 4. Build Tauri Windows
  # -------------------------------------------------------------------------
  tauri-windows:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: dashboard-app/app/pnpm-lock.yaml

      - name: Installer pnpm
        run: npm install -g pnpm@9

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-app/app/src-tauri

      - name: Installer dependances frontend
        working-directory: dashboard-app/app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: dashboard-app/app
        run: pnpm tauri build --verbose
        env:
          CI: true

      - name: Upload artefacts Tauri (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            dashboard-app/app/src-tauri/target/release/app.exe
            dashboard-app/app/src-tauri/target/release/bundle/msi/*.msi
            dashboard-app/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

  # -------------------------------------------------------------------------
  # 5. Build image Docker du serveur headless
  # -------------------------------------------------------------------------
  docker:
    name: Build image Docker serveur
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: pont-saisie-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # -------------------------------------------------------------------------
  # 6. Tests React (Vitest)
  # -------------------------------------------------------------------------
  react-tests:
    name: Tests React (Vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: dashboard-app/app/pnpm-lock.yaml

      - name: Installer pnpm
        run: npm install -g pnpm@9

      - name: Installer dependances
        working-directory: dashboard-app/app
        run: pnpm install --frozen-lockfile

      - name: Lancer les tests
        working-directory: dashboard-app/app
        run: pnpm test
